services:
  postgres:
    image: postgres:17.12-bookworm
    container_name: uniplex-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    shm_size: 256mb
    mem_limit: 2g

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    networks:
      - database

  qdrant:
    image: qdrant/qdrant:v1.20.2-unprivileged
    container_name: uniplex-qdrant
    restart: unless-stopped

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}

    volumes:
      - qdrant_data:/qdrant/storage

    mem_limit: 2g

    security_opt:
      - no-new-privileges:true

    networks:
      - database

volumes:
  postgres_data:
  qdrant_data:

networks:
  database:
    name: uniplex_database
    driver: bridge
    internal: true
